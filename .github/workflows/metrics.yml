name: GitHub Metrics

on:
  schedule:
    - cron: "0 3 * * *"        # diariamente às 00:00 (America/Sao_Paulo)
  workflow_dispatch:           # permite rodar manualmente

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Saldanhaa7
          template: classic
          base: header, repositories
          config_timezone: America/Sao_Paulo
          config_output: svg
          filename: github-metrics.svg

          # SVG vai para a branch "metrics" — mantém o master limpo
          committer_branch: metrics
          committer_message: "chore: update github-metrics.svg [skip ci]"

          # Linguagens (ignora repo com venv commitado e artefatos de build)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_details: percentage
          plugin_languages_ignored: c, cython, css, html
          plugin_languages_skipped: |
            Aulas_Scraping
            website

          # Calendário de contribuições (substitui o activity-graph desativado)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
